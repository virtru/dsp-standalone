metadata:
  version_platform_service_module: v0.0.0
namespaces:
- name: company.com
  fqn: https://company.com
  attributes:
  - name: classification
    rule: 1
    fqn: https://company.com/attr/classification
    values:
    - value: mnpi
      fqn: https://company.com/attr/classification/value/mnpi
      subject_mappings:
      - subject_condition_set:
          subject_sets:
          - condition_groups:
            - conditions:
              - subject_external_selector_value: .attributes.dept[]
                subject_external_values:
                - Engineering
                - HR
                - Accounting
                - Sales
                operator: 1
              boolean_operator: 1
        actions:
        - name: read
    - value: pci
      fqn: https://company.com/attr/classification/value/pci
      subject_mappings:
      - subject_condition_set:
          subject_sets:
