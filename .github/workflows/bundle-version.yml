name: Bundle version validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check shell syntax
        run: bash -n setup_and_validate.sh tests/test_bundle_version.sh
      - name: Test bundle version detection
        run: bash tests/test_bundle_version.sh
