baseUrl: &baseUrl https://local-dsp.virtru.com:18443
serverBaseUrl: &serverBaseUrl https://local-dsp.virtru.com:8080
customAudMapper: &customAudMapper
  name: audience-mapper
  protocol: openid-connect
  protocolMapper: oidc-audience-mapper
  config:
    included.client.audience: *serverBaseUrl
    access.token.claim: 'true'
    id.token.claim: 'true'
realms:
  - realm_repepresentation:
      realm: opentdf
      enabled: true
    custom_realm_roles:
      - name: opentdf-org-admin
      - name: opentdf-admin
      - name: opentdf-standard
    custom_client_roles:
      tdf-entity-resolution:
        - name: entity-resolution-test-role
    custom_groups:
      - name: mygroup
        attributes:
          mygroupattribute:
            - mygroupvalue
    clients:
      # S4 (secure object proxy) backend service client. Required for the COP
      # "Start Simulation" flow when the cop stack is run with --profile s4:
      # the s4 container authenticates as this client, and add_manifests.py /
      # seed_data.py use secure-object-proxy-test below to upload manifests.
      - client:
          clientID: secure-object-proxy
          enabled: true
          name: secure-object-proxy
          serviceAccountsEnabled: true
          clientAuthenticatorType: client-secret
          secret: secret
          protocolMappers:
            - *customAudMapper
        sa_realm_roles:
          - opentdf-org-admin
      - client:
          clientID: secure-object-proxy-test
          enabled: true
          name: secure-object-proxy-test
          serviceAccountsEnabled: true
          clientAuthenticatorType: client-secret
          directAccessGrantsEnabled: true
          secret: secret
          protocolMappers:
            - *customAudMapper
            - name: secure-object-proxy-audience-mapper
              protocol: openid-connect
              protocolMapper: oidc-audience-mapper
              config:
                included.client.audience: secure-object-proxy
                access.token.claim: 'true'
                id.token.claim: 'true'
        sa_realm_roles:
          - opentdf-standard
      - client:
          clientID: opentdf
          enabled: true
          name: opentdf
          serviceAccountsEnabled: true
          clientAuthenticatorType: client-secret
          secret: secret
          protocolMappers:
            - *customAudMapper
        sa_realm_roles:
          - opentdf-org-admin
      - client:
          clientID: opentdf-sdk
          enabled: true
          name: opentdf-sdk
          serviceAccountsEnabled: true
          clientAuthenticatorType: client-secret
          secret: secret
          protocolMappers:
            - *customAudMapper
        sa_realm_roles:
          - opentdf-standard
      - client:
          clientID: opentdf-public
          enabled: true
          name: opentdf-public
          serviceAccountsEnabled: false
          publicClient: true
          directAccessGrantsEnabled: true
          redirectUris:
            - 'http://localhost:9000/*' # tructl CLI tool
          protocolMappers:
            - *customAudMapper
      - client:
          clientID: tdf-entity-resolution
          enabled: true
          name: tdf-entity-resolution
          serviceAccountsEnabled: true
          clientAuthenticatorType: client-secret
          secret: secret
          protocolMappers:
            - *customAudMapper
        sa_client_roles:
          realm-management:
            - view-clients
            - query-clients
            - view-users
            - query-users
      - client:
          clientID: tdf-authorization-svc
          enabled: true
          name: tdf-authorization-svc
          serviceAccountsEnabled: true
          clientAuthenticatorType: client-secret
          secret: secret
          protocolMappers:
            - *customAudMapper
      # Public client used for password flow authentication of COP frontend
      - client:
          clientID: dsp-cop-client
          enabled: true
          name: dsp-cop-client
          directAccessGrantsEnabled: true
          publicClient: true
          redirectUris:
           # WARNING: This is a local development configuration. Do not use in production.
            - '*'
          webOrigins:
           # WARNING: This is a local development configuration. Do not use in production.
             - '*'
          protocolMappers:
            - *customAudMapper
            # Allows COP frontend tokens to be accepted by the S4 proxy.
            - name: secure-object-proxy-audience-mapper
              protocol: openid-connect
              protocolMapper: oidc-audience-mapper
              config:
                included.client.audience: secure-object-proxy
                access.token.claim: 'true'
                id.token.claim: 'true'
    users:
      #  With Keycloak idP attributes below, the user below is entitled through Subject Mappings/Subject Condition Sets to DSP policy Attribute Values:
      # | Attribute Definition FQN              | Entitled To Forms/Data of Values    | Attribute Rule Type            |
      # |---------------------------------------|-------------------------------------|--------------------------------|
      # | https://demo.com/attr/needtoknow      | aaa, bbb, int, ops                  | all_of                         |
      # | https://demo.com/attr/classification  | secret, confidential, unclassified  | hierarchy                      |
      # | https://demo.com/attr/relto           | usa, nato, fvey, pink               | any_of                         |
      - username: secret-usa-aaa
        enabled: true
        firstName: Alice
        lastName: SecretUSA
        email: aaa@secret.usa
        credentials:
          - value: testuser123
            type: password
        attributes:
          nationality:
            - USA
          needToKnow:
            - AAA
            - BBB
            - INT
            - OPS
          clearance:
            - S
        groups:
          - mygroup
        realmRoles:
          - opentdf-org-admin
        clientRoles:
          realm-management:
            - view-clients
            - query-clients
            - view-users
            - query-users
          tdf-entity-resolution:
            - entity-resolution-test-role
      #  With Keycloak idP attributes below, the user below is entitled through Subject Mappings/Subject Condition Sets to DSP policy Attribute Values:
      # | Attribute Definition FQN              | Entitled To Forms/Data of Values                  | Attribute Rule Type            |
      # |---------------------------------------|---------------------------------------------------|--------------------------------|
      # | https://demo.com/attr/needtoknow      | bbb                                               | all_of                         |
      # | https://demo.com/attr/classification  | topsecret, secret, confidential, unclassified     | hierarchy                      |
      # | https://demo.com/attr/relto           | gbr, nato, fvey, pink                             | any_of                         |
      - username: top-secret-gbr-bbb
        enabled: true
        firstName: Bob
        lastName: TopSecretGBR
        email: bbb@topsecret.gbr
        realmRoles:
          - opentdf-standard
        credentials:
          - value: testuser123
            type: password
        attributes:
          nationality:
            - GBR
          needToKnow:
            - BBB
          clearance:
            - TS
      #  With Keycloak idP attributes below, the user below is entitled through Subject Mappings/Subject Condition Sets to DSP policy Attribute Values:
      # | Attribute Definition FQN              | Entitled To Forms/Data of Values                  | Attribute Rule Type            |
      # |---------------------------------------|---------------------------------------------------|--------------------------------|
      # | https://demo.com/attr/needtoknow      | int                                               | all_of                         |
      # | https://demo.com/attr/classification  | confidential, unclassified                        | hierarchy                      |
      # | https://demo.com/attr/relto           | fra, pink, nato                                   | any_of                         |
      - username: classified-fra-int
        enabled: true
        firstName: Jane
        lastName: ClassifiedFRA
        email: int@classified.fra
        realmRoles:
          - opentdf-standard
        credentials:
          - value: testuser123
            type: password
        attributes:
          nationality:
            - FRA
          needToKnow:
            - INT
          clearance:
            - C
      #  With Keycloak idP attributes below, the user below is entitled through Subject Mappings/Subject Condition Sets to DSP policy Attribute Values:
      # | Attribute Definition FQN              | Entitled To Forms/Data of Values                  | Attribute Rule Type            |
      # |---------------------------------------|---------------------------------------------------|--------------------------------|
      # | https://demo.com/attr/needtoknow      | < none >                                          | all_of                         |
      # | https://demo.com/attr/classification  | unclassified                                      | hierarchy                      |
      # | https://demo.com/attr/relto           | mex                                               | any_of                         |
      - username: unclassified-mex-user
        enabled: true
        firstName: James
        lastName: UnclassifiedMEX
        email: user@unclassified.mex
        realmRoles:
          - opentdf-standard
        credentials:
          - value: testuser123
            type: password
        attributes:
          nationality:
            - MEX
          clearance:
            - U
      #  With Keycloak idP attributes below, the user below is entitled through Subject Mappings/Subject Condition Sets to DSP policy Attribute Values:
      # | Attribute Definition FQN              | Entitled To Forms/Data of Values     | Attribute Rule Type            |
      # |---------------------------------------|---------------------------------------------------|--------------------------------|
      # | https://demo.com/attr/needtoknow      | aaa, bbb                                          | all_of                         |
      # | https://demo.com/attr/classification  | topsecret, secret, confidential, unclassified     | hierarchy                      |
      # | https://demo.com/attr/relto           | usa, fvey, nato, pink                             | any_of                         |
      - username: top-secret-usa-aaa
        enabled: true
        firstName: Alex
        lastName: TopsecretUSA
        email: aaa@topsecret.usa
        credentials:
          - value: testuser123
            type: password
        attributes:
          nationality:
            - USA
          needToKnow:
            - AAA
            - BBB
          clearance:
            - TS
        realmRoles:
          - opentdf-standard
      # ----------------------------------------------------------------------
      # company.com namespace sample users (see company-policy/).
      # Each user carries a single Keycloak `dept` attribute. The company.com
      # subject mappings resolve entitlements from that dept value:
      #   - ANY dept           -> sensitivity/confidential (+ public via hierarchy)
      #   - dept == Engineering-> classification: mnpi
      #   - dept == HR         -> classification: mnpi, pii, phi
      #   - dept == Accounting -> classification: mnpi, pii, pci
      #   - dept == Sales      -> classification: mnpi, pii
      #   - dept value         -> the matching department/<value>
      # | Attribute Definition FQN                 | Rule Type |
      # |------------------------------------------|-----------|
      # | https://company.com/attr/department      | any_of    |
      # | https://company.com/attr/sensitivity     | hierarchy |
      # | https://company.com/attr/classification  | all_of    |
      # ----------------------------------------------------------------------
      - username: eng-user
        enabled: true
        firstName: Erin
        lastName: Engineering
        email: erin@company.com
        credentials:
          - value: testuser123
            type: password
        attributes:
          dept:
            - Engineering
        realmRoles:
          - opentdf-standard
      - username: hr-user
        enabled: true
        firstName: Hana
        lastName: HumanResources
        email: hana@company.com
        credentials:
          - value: testuser123
            type: password
        attributes:
          dept:
            - HR
        realmRoles:
          - opentdf-standard
      - username: accounting-user
        enabled: true
        firstName: Amir
        lastName: Accounting
        email: amir@company.com
        credentials:
          - value: testuser123
            type: password
        attributes:
          dept:
            - Accounting
        realmRoles:
          - opentdf-standard
      - username: sales-user
        enabled: true
        firstName: Sara
        lastName: Sales
        email: sara@company.com
        credentials:
          - value: testuser123
            type: password
        attributes:
          dept:
            - Sales
        realmRoles:
          - opentdf-standard
    token_exchanges:
      - start_client: opentdf
        target_client: opentdf-sdk
