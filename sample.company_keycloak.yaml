      # |-----------------------------------------|------------------------------------|--------------------------------|
      # | https://company.com/attr/department     | Accounting                         | any_of                         |
      # | https://company.com/attr/sensitivity    | confidential, public               | hierarchy                      |
      # | https://company.com/attr/classification | PII, PCI, MNPI                     | all_of                         |
