################################################################################
#
# Minimal DSP-only Docker Compose
#
# Starts only the base components required to run a Virtru Data Security
# Platform (DSP):
#   - Keycloak (identity provider) + its Postgres database
#   - DSP service + its Postgres database
#   - Keycloak provisioning (realm, clients, users)
#   - DSP policy provisioning (federal_policy)
#
# Excluded: COP web server, COP database, NiFi, tagging services.
#
# Prerequisites:
#   1. /etc/hosts contains:  127.0.0.1  local-dsp.virtru.com
#   2. TLS certificates exist in ./dsp-keys/
#      (generate with `./setup_and_validate.sh --bundle /path/to/bundle`)
#   3. DSP image is available in the local registry:
#        docker run -d -p 5000:5000 --name registry registry:2
#        ./dsp copy-images --insecure localhost:5000/virtru
#
# Usage:
#   docker compose up --build
#
# Exposed ports:
#   25434 - Keycloak Postgres
#   35433 - DSP Postgres
#   8888  - Keycloak HTTP (health only; HTTPS is the primary endpoint)
#   18443 - Keycloak HTTPS
#   8080  - DSP services (gRPC + HTTP)
#
################################################################################

name: virtru-dsp-only

services:

  #================================================================
  # Keycloak database
  # Bridge-networked so its port is published to the host.
  # Keycloak (host-networked) connects via localhost:25434.
  #----------------------------------------------------------------
  keycloak-db:
    image: postgres:16@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
    restart: always
    user: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: keycloak
    ports:
      - "25434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 5s
      timeout: 5s
      retries: 10

  #================================================================
  # Keycloak identity provider
  #----------------------------------------------------------------
  keycloak:
    image: keycloak/keycloak:25.0@sha256:82c5b7a110456dbd42b86ea572e728878549954cc8bd03cd65410d75328095d2
    restart: always
    command: ["start-dev"]
    network_mode: host
    environment:
      KC_HTTP_RELATIVE_PATH: /auth
      KC_DB_VENDOR: postgres
      KC_DB_URL_HOST: localhost
      KC_DB_URL_PORT: 25434
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: changeme
      KC_HOSTNAME: local-dsp.virtru.com
      KC_HOSTNAME_PORT: "18443"
      KC_HOSTNAME_STRICT_HTTPS: "true"
      KC_HTTP_ENABLED: "false"
      KC_HTTP_PORT: 8888
      KC_HTTPS_PORT: 18443
      KC_HTTPS_CERTIFICATE_FILE: /opt/keycloak/conf/local-dsp.virtru.com.pem
      KC_HTTPS_CERTIFICATE_KEY_FILE: /opt/keycloak/conf/local-dsp.virtru.com.key.pem
      KC_HTTPS_CLIENT_AUTH: request
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: changeme
      KC_FEATURES: "preview,token-exchange"
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./dsp-keys/local-dsp.virtru.com.pem:/opt/keycloak/conf/local-dsp.virtru.com.pem:z
      - ./dsp-keys/local-dsp.virtru.com.key.pem:/opt/keycloak/conf/local-dsp.virtru.com.key.pem:z
    depends_on:
      keycloak-db:
        condition: service_healthy
    # NOTE: the keycloak/keycloak:25.0 image ships without curl/wget, so the
    # healthcheck cannot shell out to an HTTP client. The management interface
    # is also HTTPS-only here (KC_HTTP_ENABLED=false). Probe readiness over the
    # management port (9000) using bash's built-in /dev/tcp, which is available
    # in the image.
    healthcheck:
      # The keycloak:25.0 image ships no curl/wget (UBI-micro), and the health
      # endpoint on 9000 is HTTPS — so the old `curl http://...9000` probe always
      # exited 127 (curl: command not found) and the service never went healthy.
      # Mirror the dsp service: try curl (for images that have it), else a bash
      # /dev/tcp connect to the HTTPS auth port that dependents actually use.
      test:
        - CMD-SHELL
        - bash -c 'exec 3<>/dev/tcp/127.0.0.1/9000' >/dev/null 2>&1
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 60s

  #================================================================
  # Provision Keycloak: realm, clients, and users from sample.keycloak.yaml
  #----------------------------------------------------------------
  dsp-keycloak-provisioning:
    platform: linux/amd64
    build:
      context: .
      dockerfile: ./dev.dsp.Dockerfile
      network: host
      args:
        DSP_IMAGE: ${DSP_IMAGE:-localhost:5000/virtru/data-security-platform:v2.7.14}
    command:
      - tructl
      - provision
      - keycloak-from-config
      - -e
      - https://local-dsp.virtru.com:18443/auth
    network_mode: host
    restart: on-failure
    depends_on:
      keycloak:
        condition: service_healthy
        restart: true

  #================================================================
  # DSP Postgres database
  #----------------------------------------------------------------
  dsp-db:
    image: postgres:16@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
    restart: always
    user: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: opentdf
    ports:
      - "35433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 5s
      timeout: 5s
      retries: 10

  #================================================================
  # DSP service (KAS, policy, entity resolution, authorization)
  #----------------------------------------------------------------
  dsp:
    platform: linux/amd64
    build:
      context: .
      dockerfile: ./dev.dsp.Dockerfile
      network: host
      args:
        DSP_IMAGE: ${DSP_IMAGE:-localhost:5000/virtru/data-security-platform:v2.7.14}
    command: ["start"]
    network_mode: host
    restart: always
    volumes:
      - ./dsp-keys:/dsp-keys:z
      - ./.generated/tagging-pdp-workflows.yaml:/config/tagging-pdp-workflows.yaml:ro,z
    environment:
      DSP_DB_HOST: localhost
      DSP_DB_PORT: 35433
      DSP_DB_USER: postgres
      DSP_DB_PASSWORD: changeme
    depends_on:
      keycloak:
        condition: service_healthy
        restart: true
      dsp-keycloak-provisioning:
        condition: service_completed_successfully
        restart: true
      dsp-db:
        condition: service_healthy
        restart: true
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fkSs --max-time 5 https://local-dsp.virtru.com:8080/healthz >/dev/null 2>&1 || bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080' 2>/dev/null
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 60s

  #================================================================
  # Provision DSP with the federal attribute policy
  #----------------------------------------------------------------
  dsp-provision-federal-policy:
    platform: linux/amd64
    build:
      context: .
      dockerfile: ./dev.dsp.Dockerfile
      network: host
      args:
        DSP_IMAGE: ${DSP_IMAGE:-localhost:5000/virtru/data-security-platform:v2.7.14}
    command:
      - tructl
      - provision
      - policy
      - -f
      - ./samples/defaults/federal_policy.yaml
      - --with-client-creds
      - '{"clientId":"opentdf","clientSecret":"secret"}'
      - --host
      - https://local-dsp.virtru.com:8080
    network_mode: host
    restart: on-failure
    depends_on:
      dsp:
        condition: service_healthy
